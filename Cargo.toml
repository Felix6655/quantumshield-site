[package]
name = "quantumshield"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
blake3 = "1"
pqcrypto-dilithium = "0.5"
bech32 = "0.9"
pqcrypto-traits = "0.3.5"

[[bin]]
name = "qs-node"
path = "src/bin/qs-node.rs"
